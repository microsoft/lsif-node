name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - "release/*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: npm ci

      - name: Run hygiene checks
        run: |
          npm run check:isolated-lockfiles
          npm run lint

      - name: Compile
        run: npm run compile

      - name: Run unit tests
        run: npm run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: util/junit.xml
          if-no-files-found: ignore
